name: Backend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'backend/**'
      - 'fixtures/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: busnext_test
          POSTGRES_USER: busnext
          POSTGRES_PASSWORD: busnext
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U busnext -d busnext_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: busnext_test
      DB_USERNAME: busnext
      DB_PASSWORD: busnext
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathai/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, zip, curl, pgsql, pdo_pgsql
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application
        run: php artisan migrate --force

      - name: Run formatter check
        run: composer lint

      - name: Run tests
        run: composer test
