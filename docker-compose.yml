services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: busnext
      POSTGRES_USER: busnext
      POSTGRES_PASSWORD: busnext
    ports:
      - "5432:5432"
    volumes:
      - busnext-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  busnext-postgres:
